name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS
          $THEOS/bin/update-theos 2>/dev/null || true
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Setup SDK
        run: |
          mkdir -p $THEOS/sdks
          if [ ! -f "$THEOS/sdks/iPhoneOS15.0.sdk/SDKSettings.plist" ]; then
            curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master/iPhoneOS15.0.sdk.tar.xz || true
            tar -xJf /tmp/sdk.tar.xz -C $THEOS/sdks || true
          fi
          ls $THEOS/sdks

      - name: Build
        run: |
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tail -100

      - name: Collect artifacts
        run: |
          mkdir -p out
          find . -name "*.dylib" -exec cp {} out/ \;
          find . -name "*.deb"   -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: warrior-cheat
          path: out/
